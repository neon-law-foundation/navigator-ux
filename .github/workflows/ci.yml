name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Explicit `types:` because the release chain below needs `closed` added to
  # the default set (opened, synchronize, reopened) — see `release-version`.
  # `ready_for_review` is included too: `enable-automerge`'s `if` has checked
  # for that action since it was added, but nothing ever fired the workflow on
  # it, so marking a draft ready for review has never armed auto-merge on its
  # own until now.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default every job to read-only; the one job that needs more
# (enable-automerge) requests write at the job level, so lint and verify never
# run with it.
permissions:
  contents: read

jobs:
  # Fast and dependency-light, so a style problem reports in seconds rather
  # than behind a full build.
  lint:
    # Skip only a PR that closed WITHOUT merging — adding `closed` to the
    # pull_request trigger above (for the release chain) would otherwise rerun
    # the full suite against an abandoned branch for no reader.
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # Source-level and dependency-free, so it belongs with lint rather than
      # behind a build: no literal color outside the token layer.
      - run: pnpm check:tokens

      # Its sibling, on the same terms: the two weights the typeface actually
      # has, and no corner radius written as a literal. Both drifted while
      # `matter.css` was monospace, where a synthesized 800 is indistinguishable
      # from a real one.
      - run: pnpm check:type

      # The third of the source-level gates: every contrast ratio the palette
      # claims, recomputed from tokens.css. The comments stating those ratios
      # were written by hand and could not be checked by eye — the first run of
      # this gate found two status colors that had never cleared AA.
      - run: pnpm check:contrast

      # The typed client must stay on the pinned OpenAPI snapshot.
      - run: pnpm check:api

  verify:
    # Same skip as lint, and for the same reason.
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile

      # Build before typecheck. Nothing in this repository consumes the built
      # dist, so the order is not load-bearing here — it is kept because it is
      # load-bearing in a consuming app, which resolves the package through its
      # dist and fails with "cannot find module" if typecheck runs first. Same
      # command meaning the same thing in both places is worth one wasted
      # ordering constraint.
      - run: pnpm build
      - run: pnpm check:packed-consumer
      - run: pnpm typecheck

      # Nothing in the built bundle may reach off-origin — no CDN, no remote
      # font, no icon package fetched at runtime. Runs against dist, so it has
      # to follow the build.
      - run: pnpm check:bundle

      # Fails the build below 90% statements, lines, functions, or branches.
      # Thresholds live in vite.config.ts.
      - run: pnpm test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  e2e:
    # Same skip as lint, and for the same reason.
    if: github.event.action != 'closed' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:e2e

  # Turn on GitHub auto-merge on open / ready-for-review AND on every push
  # (`synchronize`). Auto-merge squash-merges the PR the moment `verify` is
  # green and every review thread is resolved — no manual "Merge when ready".
  # The step is idempotent (it exits early when auto-merge is already on), so
  # re-running on every push is a harmless no-op that also re-arms auto-merge
  # if a push cleared it. To hold a ready PR, convert it to draft (the
  # `draft == false` guard skips drafts), not by disabling auto-merge.
  #
  # Arming only *requests* the merge; GitHub still holds the PR until the
  # required `verify` check passes. That required check is also what makes
  # arming possible at all: with nothing required, the mutation is refused with
  # "Pull request is in unstable status" because auto-merge has nothing to wait
  # on. The fork guard skips PRs from forks, whose GITHUB_TOKEN is read-only.
  #
  # This uses GITHUB_TOKEN. A GitHub App token would give a stable bot
  # identity, but that path is inert until AUTOMERGE_APP_ID and
  # AUTOMERGE_APP_PRIVATE_KEY exist as Actions secrets, and this repository has
  # none.
  enable-automerge:
    name: enable PR auto-merge
    # Only this job needs write; lint and verify stay contents:read (above).
    # enablePullRequestAutoMerge requires contents:write — pull-requests:write
    # alone returns "Resource not accessible by integration".
    permissions:
      contents: write
      pull-requests: write
    if: >
      github.event_name == 'pull_request' &&
      (github.event.action == 'opened' || github.event.action == 'ready_for_review' || github.event.action == 'synchronize') &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: request auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # Derive the API host from the run itself rather than letting `gh`
          # default to github.com. That default is correct today and was not
          # when this repository lived on GitHub Enterprise Cloud with data
          # residency, where an Actions token sent to api.github.com came back
          # "Bad credentials" (HTTP 401) rather than a permissions error. Two
          # lines to keep the block portable is cheaper than rediscovering that.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          export GH_HOST
          auto_merge_enabled="$(
              gh pr view "${PR_URL}" \
                  --json autoMergeRequest \
                  --jq '.autoMergeRequest != null'
          )"
          if [ "${auto_merge_enabled}" = "true" ]; then
              echo "auto-merge already enabled; nothing to do."
              exit 0
          fi
          # Enable auto-merge via the GraphQL mutation rather than
          # `gh pr merge --auto`: a current `gh pr merge --auto` (no method)
          # hard-errors non-interactively ("--merge, --rebase, or --squash
          # required"). `enablePullRequestAutoMerge` needs an explicit
          # `mergeMethod` — omitting it defaults to MERGE, which the production
          # ruleset disallows ("Merge method merge commits are not allowed").
          # SQUASH is the only allowed method, so it is accepted.
          pr_id="$(gh pr view "${PR_URL}" --json id --jq '.id')"
          # A PR that edits any `.github/workflows/*` file cannot be
          # auto-merged by an Actions token: it deliberately lacks the
          # `workflows` permission, so GitHub refuses the mutation with a
          # "refusing to allow a GitHub App to create or update workflow ...
          # without `workflows` permission" error. That is expected and
          # unfixable from CI (such PRs are armed or merged by hand), so treat
          # only that refusal as a soft pass; any other failure is real.
          if ! result="$(gh api graphql -f pr="${pr_id}" -f query='
              mutation($pr: ID!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $pr, mergeMethod: SQUASH }) {
                  pullRequest { number }
                }
              }' 2>&1)"; then
              if printf '%s' "${result}" | grep -q 'refusing to allow a GitHub App to create or update workflow'; then
                  echo "PR edits workflow files; the Actions token cannot enable auto-merge (it lacks the workflows permission). Arm or merge this PR manually."
                  printf '%s\n' "${result}"
                  exit 0
              fi
              printf '%s\n' "${result}" >&2
              exit 1
          fi
          printf '%s\n' "${result}"

  # Decides whether this run carries a release, by comparing package.json's
  # version against every tag already on the remote — the same
  # `scripts/release-default-tag.mjs --check-manifest` the cut-release
  # preflight runs on a branch. On a pull_request run this identifies a
  # release candidate before merge; the tag job below waits for the actual
  # merge commit before publishing. An ordinary PR or merge answers
  # `publishable=false` and the two jobs below are no-ops.
  #
  # THE VERSION IS THE MANIFEST. There is no separate tag push to check it
  # against, so the mismatch the old `release` job used to guard against
  # (tagging v26.8.31 without bumping package.json) is unsatisfiable by
  # construction rather than merely caught.
  #
  # The successful PR run is the bot-merge path: it discovers the candidate
  # before merge, waits for the PR to report its landed commit, and publishes
  # from that commit. This is necessary because a GITHUB_TOKEN merge
  # suppresses the follow-up workflow events, including `pull_request: closed`.
  # `push` and `closed` remain reconciliation paths for human merges; see
  # docs/releasing.md for the incident evidence.
  release-version:
    name: did main just gain a release?
    needs: [lint, verify, e2e]
    if: |
      always() &&
      (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (
            github.event.action != 'closed' ||
            (github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main')
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publishable: ${{ steps.check.outputs.publishable }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      # The script lists tags with `git ls-remote`, so history depth does not
      # matter — the default shallow checkout is enough. For a PR candidate,
      # the head commit is sufficient because this job only reads its manifest;
      # release-tag resolves the commit that actually landed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: compare package.json against published tags
        id: check
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(node scripts/release-is-prerelease.mjs)" >> "$GITHUB_OUTPUT"
          if node scripts/release-default-tag.mjs --check-manifest; then
              echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
              echo "publishable=false" >> "$GITHUB_OUTPUT"
          fi

  # Creates and pushes the tag `release-version` named, once the merge gate is
  # green and the version is a genuine bump. A tag pushed with the run's own
  # `GITHUB_TOKEN` does not start a second workflow run (the same rule that
  # makes `release-version` need two triggers above), so `release` below runs
  # inside THIS run rather than waiting on one.
  #
  # NOT SIGNED. The human flow this replaces used `git tag -s`; a CI-created
  # tag has no GPG key to sign with, and this repository deliberately holds no
  # secrets to provision one. What's gained is that the tag can no longer
  # disagree with the manifest it names; what's given up is a signature. An
  # annotated (not lightweight) tag under the bot identity is the middle
  # ground kept here.
  release-tag:
    name: cut the release tag
    needs: [release-version]
    if: needs.release-version.outputs.publishable == 'true'
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One lane shared with `release` (and with itself across overlapping
    # runs): `push` and `pull_request: closed` can both fire for the same
    # merge — a human clicking "Merge pull request" themselves produces a
    # real push AND closes the PR — and the two events carry different
    # `github.ref` values, so the workflow-level concurrency group above does
    # not deduplicate them. Queuing rather than racing means the second run's
    # own tag-exists check (below) sees the first run's tag and turns into a
    # no-op instead of a `git push` conflict.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: resolve the landed commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          export GH_HOST
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" != "closed" ]; then
              for attempt in $(seq 1 120); do
                  pr_json="$(gh pr view "${PR_URL}" --json mergedAt,mergeCommit,state)"
                  merged_at="$(printf '%s' "${pr_json}" | jq -r '.mergedAt // empty')"
                  sha="$(printf '%s' "${pr_json}" | jq -r '.mergeCommit.oid // empty')"
                  if [ -n "${merged_at}" ] && [ -n "${sha}" ]; then
                      echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
                      exit 0
                  fi
                  state="$(printf '%s' "${pr_json}" | jq -r '.state')"
                  if [ "${state}" = "CLOSED" ]; then
                      echo "release candidate PR closed without a merge" >&2
                      exit 1
                  fi
                  echo "waiting for ${PR_URL} to merge (attempt ${attempt}/120)"
                  sleep 5
              done
              echo "timed out waiting for ${PR_URL} to merge" >&2
              exit 1
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
              sha="${{ github.event.pull_request.merge_commit_sha }}"
              [ -n "${sha}" ] || { echo "merged PR has no merge commit" >&2; exit 1; }
              echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          else
              echo "sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          fi
      - name: check out the landed commit
        env:
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "${SHA}"
          git checkout --detach "${SHA}"
      - name: create and push the tag
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "${TAG}" >/dev/null 2>&1; then
              echo "${TAG} already exists on origin; nothing to do."
              exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a "${TAG}" -m "navigator-ux ${TAG}"
          git push origin "${TAG}"

  # Cuts the release: builds, packs a tarball, and attaches it to the GitHub
  # Release for the tag `release-tag` just created. The tarball is the
  # distribution channel — consumers install from the release download URL,
  # which needs no registry account and no `.npmrc`. See
  # docs/consuming-the-library.md.
  #
  # The tarball is what `pnpm pack` produces, so it carries `dist` and nothing
  # else `files` excludes. That distinction is the whole reason this job exists
  # rather than pointing consumers at the git URL: `dist` is gitignored and
  # there is no `prepare` script, so `pnpm add <git url>` resolves, installs a
  # package containing only the licenses and the README, and fails at the
  # consumer's first import with "Cannot find module .../dist/index.js". The
  # install itself goes green, which is what makes it worth spending a job to
  # avoid.
  #
  # No explicit `if:` here — plain `needs:` already skips this job whenever
  # any dependency (including `release-tag` answering "not a release") was
  # skipped rather than successful, which is exactly the behavior wanted.
  release:
    needs: [lint, verify, release-version, release-tag]
    runs-on: ubuntu-latest
    permissions:
      # Creating the release and uploading the tarball to it both need write.
      # Nothing here needs id-token: that was for npm build provenance, and
      # this project does not publish to a registry.
      contents: write
    # Same lane as `release-tag` — see its comment.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-tag.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Pinned to a literal filename rather than left to pnpm's default, which
      # flattens the scope into `neon-law-source-code-navigator-ux-<version>.tgz`.
      # Consumers paste this URL into a manifest by hand, so the name is part of
      # the contract and should be predictable from the tag alone.
      - name: pack the tarball
        env:
          TAG: ${{ needs.release-version.outputs.tag }}
        run: pnpm pack --out "navigator-ux-${TAG}.tgz"

      # Idempotent, so re-running a release job is a no-op rather than a
      # failure: `gh release create` refuses a tag that already has a release,
      # which is exactly the state a re-run is in.
      - name: create the release and attach the tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-version.outputs.tag }}
          PRERELEASE: ${{ needs.release-version.outputs.prerelease }}
        run: |
          set -euo pipefail
          # Derive the API host from the run rather than letting `gh` default to
          # github.com, for the same reason the auto-merge job does.
          GH_HOST="${GITHUB_SERVER_URL#https://}"
          export GH_HOST
          tarball="navigator-ux-${TAG}.tgz"
          # A -hotfix.N version ranks below its matching ordinary release (see
          # docs/releasing.md), so its GitHub Release must not present itself
          # as "Latest release" either.
          prerelease_flag=()
          if [ "${PRERELEASE}" = "true" ]; then
              prerelease_flag=(--prerelease)
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
              echo "release ${TAG} exists; replacing the tarball."
              gh release upload "${TAG}" "${tarball}" --clobber
          else
              gh release create "${TAG}" "${tarball}" \
                  --title "${TAG}" \
                  --generate-notes \
                  "${prerelease_flag[@]}"
          fi

  # The single required status check. It runs nothing itself: the jobs above do
  # the work and this one reports their combined result under one context name
  # that never has to move.
  #
  # A required status check is matched by string, so renaming a working job
  # renames its check run while the ruleset goes on waiting for the old
  # spelling. Nothing turns red; pull requests simply sit forever on a check
  # that will never arrive. The gate therefore terminates in a job spelled
  # exactly `ci`, leaving the jobs behind it free to be renamed.
  #
  # It tests each dependency's result explicitly rather than relying on a bare
  # `needs:`, because a skipped required check is not a red one: GitHub reports
  # no result at all, so the gate would quietly stop blocking exactly when the
  # jobs it guards had failed.
  ci:
    name: ci
    needs: [lint, verify, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: report the gate result
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          set -euo pipefail
          echo "lint: ${LINT_RESULT}"
          echo "verify: ${VERIFY_RESULT}"
          echo "e2e: ${E2E_RESULT}"
          if [ "${LINT_RESULT}" != "success" ] || [ "${VERIFY_RESULT}" != "success" ] || [ "${E2E_RESULT}" != "success" ]; then
              echo "::error::the merge gate is red"
              exit 1
          fi
